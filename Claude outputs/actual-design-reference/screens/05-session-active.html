<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:22px 24px 0;display:flex;justify-content:space-between;align-items:center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M6 18L18 6" stroke="var(--ink-soft)" stroke-width="1.7" stroke-linecap="round"/></svg>
    <div style="display:flex;gap:7px;align-items:center;">
      <div style="width:6px;height:6px;border-radius:3px;background:var(--accent);"></div>
      <div style="font-size:12px;color:var(--ink-faint);letter-spacing:0.06em;">IN PROGRESS</div>
    </div>
    <div style="width:22px;"></div>
  </div>

  <div style="padding:44px 32px 0;">
    <div style="font-size:13.5px;color:var(--ink-faint);">Work session · normal</div>
    <div style="font-size:64px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;margin-top:6px;">42:18</div>
  </div>

  <div style="padding:26px 32px 0;">
    <div style="height:4px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;">
      <div style="height:100%;width:26%;background:var(--accent);border-radius:2px;"></div>
    </div>
  </div>

  <div style="padding:16px 32px 0;display:flex;justify-content:space-between;">
    <div style="font-size:12.5px;color:var(--ink-faint);">expected around</div>
    <div style="font-size:12.5px;color:var(--ink-soft);">2h 40m · 32 sessions</div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 32px 0;">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-size:13px;color:var(--ink-soft);line-height:1.55;">
      Say "ending work session" or tap below when you're done. Nothing to confirm, Actual just records what happened.
    </div>
  </div>

  <div style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:14px;align-items:center;">
    <div style="width:80px;height:80px;border-radius:40px;background:var(--ink);display:flex;align-items:center;justify-content:center;">
      <div style="width:24px;height:24px;border-radius:5px;background:var(--bg);"></div>
    </div>
    <div style="font-size:12.5px;color:var(--ink-faint);">End session</div>
  </div>

</div>
</body>
</html>
