<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:22px 24px 6px;display:flex;flex-direction:column;gap:2px;">
    <div style="font-size:12.5px;color:var(--ink-faint);">Saturday, September 5</div>
    <div style="font-size:22px;font-weight:600;color:var(--ink);">Good afternoon, Marta</div>
  </div>

  <div style="padding:18px 24px 0;">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;">

      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <div style="font-size:12px;color:var(--ink-faint);">Active now</div>
          <div style="font-size:16px;font-weight:600;">Work session</div>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);background:rgba(255,255,255,0.06);padding:4px 10px;border-radius:20px;">normal</div>
      </div>

      <div style="display:flex;align-items:baseline;gap:8px;">
        <div style="font-size:42px;font-weight:700;letter-spacing:-0.01em;">42:18</div>
        <div style="font-size:12.5px;color:var(--ink-faint);">of ~2h 40m expected</div>
      </div>

      <div style="height:5px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;">
        <div style="height:100%;width:26%;background:var(--accent);border-radius:3px;"></div>
      </div>

      <div style="height:46px;border-radius:23px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;margin-top:2px;">End session</div>
    </div>
  </div>

  <div style="padding:24px 24px 10px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:16px;font-weight:600;">Today</div>
    <div style="font-size:12.5px;color:var(--ink-faint);">3 logged</div>
  </div>

  <div style="padding:0 24px;display:flex;flex-direction:column;gap:10px;flex-grow:1;overflow:hidden;">

    <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;gap:12px;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 18l4-9 3 5 3-8 4 12" stroke="var(--ink-soft)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <div style="font-size:14px;font-weight:500;">Commute to office</div>
          <div style="font-size:12px;color:var(--ink-faint);">guessed 25m</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:16px;font-weight:600;">38m</div>
        <div style="font-size:11px;color:var(--ink-soft);text-decoration:underline;text-decoration-color:rgba(255,255,255,0.25);">actual</div>
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;gap:12px;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 3v4M16 3v4M4 8h16M6 6h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" stroke="var(--ink-soft)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <div style="font-size:14px;font-weight:500;">Call with mum</div>
          <div style="font-size:12px;color:var(--ink-faint);">guessed 15m</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:16px;font-weight:600;">17m</div>
        <div style="font-size:11px;color:var(--ink-faint);">actual</div>
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;gap:12px;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="2" stroke="var(--ink-soft)" stroke-width="1.6"/><path d="M4 9h16" stroke="var(--ink-soft)" stroke-width="1.6"/></svg>
        <div>
          <div style="font-size:14px;font-weight:500;">Scrolling, Instagram</div>
          <div style="font-size:12px;color:var(--ink-faint);">not estimated</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:16px;font-weight:600;">24m</div>
        <div style="font-size:11px;color:var(--ink-faint);">tracked</div>
      </div>
    </div>

  </div>

  <div style="display:flex;justify-content:space-around;align-items:center;padding:14px 12px 26px;border-top:1px solid var(--line);background:var(--bg);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="var(--ink)"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round"/></svg>
    <div style="width:46px;height:46px;border-radius:23px;background:var(--accent);display:flex;align-items:center;justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"/></svg>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 19V5M11 19V9M18 19v-6" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="var(--ink-faint)" stroke-width="1.7"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round"/></svg>
  </div>

</div>
</body>
</html>
