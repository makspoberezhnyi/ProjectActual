<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#000000; --card:#1c1c1c; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --accent-dim:rgba(255,255,255,0.1); --line:rgba(255,255,255,0.08);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0a0a0a;}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#000000; --card:#1c1c1c; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --accent-dim:rgba(255,255,255,0.1); --line:rgba(255,255,255,0.08);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0a0a0a;}
  </style>
</helmet>
<div style="width:264px;height:320px;background:#0a0a0a;display:flex;align-items:center;justify-content:center;">
  <div style="width:198px;height:242px;background:var(--bg);border-radius:46px;border:3px solid #2a2a2a;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);padding:14px 14px 10px;">

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:10px;color:var(--ink-faint);">9:41</div>
      <div style="width:5px;height:5px;border-radius:3px;background:var(--accent);"></div>
    </div>

    <div style="padding-top:4px;">
      <div style="font-size:10.5px;color:var(--ink-faint);">Work session · normal</div>
    </div>

    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
      <div style="font-size:34px;font-weight:700;letter-spacing:-0.01em;">42:18</div>
      <div style="height:3px;width:120px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden;">
        <div style="height:100%;width:26%;background:var(--accent);border-radius:2px;"></div>
      </div>
      <div style="font-size:9.5px;color:var(--ink-faint);">of ~2h 40m expected</div>
    </div>

    <div style="display:flex;justify-content:center;padding-bottom:2px;">
      <div style="width:120px;height:34px;border-radius:17px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink);">End</div>
    </div>

  </div>
</div>
</body>
</html>
