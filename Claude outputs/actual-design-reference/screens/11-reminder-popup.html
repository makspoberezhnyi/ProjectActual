<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --accent-dim:rgba(255,255,255,0.08); --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --accent-dim:rgba(255,255,255,0.08); --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;">

  <div style="padding:22px 24px 6px;display:flex;flex-direction:column;gap:2px;filter:blur(2px);opacity:0.5;">
    <div style="font-size:12.5px;color:var(--ink-faint);">Saturday, September 12</div>
    <div style="font-size:22px;font-weight:600;color:var(--ink);">Good afternoon, Maksym</div>
  </div>

  <div style="padding:18px 24px 0;filter:blur(2px);opacity:0.5;">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <div style="font-size:12px;color:var(--ink-faint);">Free until</div>
          <div style="font-size:16px;font-weight:600;">4:30 PM</div>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);background:rgba(255,255,255,0.06);padding:4px 10px;border-radius:20px;">open window</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;">
    <div style="width:100%;background:var(--card);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:28px 24px 40px;display:flex;flex-direction:column;gap:18px;">

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.02em;">FITS YOUR FREE HOUR</div>
        <div style="font-size:11px;color:var(--ink-faint);background:rgba(255,255,255,0.06);padding:3px 9px;border-radius:20px;">1h open right now</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:4px;">
        <div style="font-size:22px;font-weight:600;">Call Sam</div>
        <div style="font-size:13px;color:var(--ink-faint);">from Sam · anytime Saturday</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12.5px;color:var(--ink-faint);">Your guess, Sam thought 25m</div>
        <div style="display:flex;gap:8px;">
          <div style="padding:9px 16px;border-radius:14px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);">15m</div>
          <div style="padding:9px 16px;border-radius:14px;background:var(--accent-dim);font-size:13.5px;color:var(--accent);">25m</div>
          <div style="padding:9px 16px;border-radius:14px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);">35m</div>
          <div style="padding:9px 16px;border-radius:14px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);">custom</div>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-top:4px;">
        <div style="flex-grow:1;height:52px;border-radius:26px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);">Later</div>
        <div style="flex-grow:1;height:52px;border-radius:26px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">Start now</div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
