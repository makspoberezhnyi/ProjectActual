<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:26px;">

    <div style="display:flex;flex-direction:column;gap:4px;">
      <div style="font-size:12.5px;color:var(--ink-faint);">Work session · normal</div>
      <div style="font-size:24px;font-weight:600;">Session ended</div>
    </div>

    <div style="display:flex;gap:22px;">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
        <div style="font-size:12px;color:var(--ink-faint);">You guessed</div>
        <div style="font-size:28px;font-weight:700;color:var(--ink-soft);">2h 00m</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
        <div style="font-size:12px;color:var(--ink-soft);font-weight:600;">Actual</div>
        <div style="font-size:28px;font-weight:700;color:var(--ink);">2h 47m</div>
      </div>
    </div>

    <div style="height:1px;background:var(--line);"></div>

    <div style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12.5px;color:var(--ink-faint);">Updated for next time</div>
        <div style="font-size:11px;color:var(--ink-faint);background:rgba(255,255,255,0.05);padding:3px 9px;border-radius:20px;">33 sessions</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:10px;">
        <div style="font-size:24px;font-weight:700;">2h 42m</div>
        <div style="font-size:12px;color:var(--ink-faint);">↑ up 2m</div>
      </div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.5;">Your normal work sessions are still trending a bit longer than your guesses. Nothing to do here, just something to notice.</div>
    </div>

  </div>

  <div style="padding:0 32px 46px;display:flex;flex-direction:column;gap:12px;">
    <div style="height:52px;border-radius:26px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">Done</div>
    <div style="text-align:center;font-size:12.5px;color:var(--ink-faint);">This felt unusual? <span style="color:var(--ink-soft);text-decoration:underline;">Tag the context</span></div>
  </div>

</div>
</body>
</html>
