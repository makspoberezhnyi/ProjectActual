<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;">

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 40px;">
    <div style="font-size:38px;font-weight:600;line-height:1.2;letter-spacing:-0.01em;">Know your<br/>time.</div>
  </div>

  <div style="padding:0 32px 52px;display:flex;flex-direction:column;gap:14px;">
    <div style="height:54px;border-radius:27px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:600;">Continue with email</div>
    <div style="text-align:center;font-size:12px;color:var(--ink-faint);padding-top:6px;line-height:1.5;">By continuing, you agree to our <span style="color:var(--ink-soft);">Terms</span> and <span style="color:var(--ink-soft);">Privacy Policy</span></div>
  </div>

</div>
</body>
</html>
