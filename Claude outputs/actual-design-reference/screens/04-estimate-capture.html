<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --accent-dim:rgba(255,255,255,0.08); --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    input::placeholder{color:var(--ink-faint);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --card:#1e1e1e; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --accent-dim:rgba(255,255,255,0.08); --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    input::placeholder{color:var(--ink-faint);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:22px 24px 4px;display:flex;justify-content:space-between;align-items:center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="font-size:12.5px;color:var(--ink-faint);">New task</div>
    <div style="width:22px;"></div>
  </div>

  <div style="padding:22px 24px 0;">
    <input placeholder="What are you about to do" style="width:100%;border:none;background:transparent;font-family:'Inter';font-weight:600;font-size:22px;color:var(--ink);outline:none;" value="Work session"/>
    <div style="height:1px;background:var(--line);margin-top:16px;"></div>
  </div>

  <div style="padding:24px 24px 0;display:flex;flex-direction:column;gap:10px;">
    <div style="font-size:12.5px;color:var(--ink-faint);">Context</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div style="padding:8px 14px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;">Normal</div>
      <div style="padding:8px 14px;border-radius:18px;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;">High pressure</div>
      <div style="padding:8px 14px;border-radius:18px;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;">Low energy</div>
      <div style="padding:8px 14px;border-radius:18px;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;">Distracted</div>
      <div style="padding:8px 14px;border-radius:18px;border:1px dashed var(--ink-faint);color:var(--ink-faint);font-size:13px;">+ custom</div>
    </div>
  </div>

  <div style="padding:28px 24px 0;display:flex;flex-direction:column;gap:10px;">
    <div style="font-size:12.5px;color:var(--ink-faint);">Your guess</div>
    <div style="display:flex;align-items:baseline;gap:8px;">
      <div style="font-size:44px;font-weight:700;color:var(--ink);">2h 00m</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <div style="padding:7px 14px;border-radius:14px;border:1px solid var(--line);font-size:13px;color:var(--ink-soft);">30m</div>
      <div style="padding:7px 14px;border-radius:14px;border:1px solid var(--line);font-size:13px;color:var(--ink-soft);">1h</div>
      <div style="padding:7px 14px;border-radius:14px;background:var(--accent-dim);font-size:13px;color:var(--accent);">2h</div>
      <div style="padding:7px 14px;border-radius:14px;border:1px solid var(--line);font-size:13px;color:var(--ink-soft);">3h</div>
    </div>
  </div>

  <div style="padding:22px 24px 0;">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.02em;">BASED ON YOUR HISTORY</div>
        <div style="font-size:11px;color:var(--ink-faint);background:rgba(255,255,255,0.05);padding:3px 9px;border-radius:20px;">32 sessions</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:10px;">
        <div style="font-size:30px;font-weight:700;color:var(--ink);">2h 40m</div>
        <div style="font-size:12px;color:var(--ink-faint);">↑ up from 2h 25m</div>
      </div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.5;">Your normal work sessions have run about 33% longer than your guess recently.</div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 24px 44px;display:flex;gap:12px;">
    <div style="flex-grow:1;height:52px;border-radius:26px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);">Keep my guess</div>
    <div style="flex-grow:1;height:52px;border-radius:26px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">Use 2h 40m</div>
  </div>

</div>
</body>
</html>
