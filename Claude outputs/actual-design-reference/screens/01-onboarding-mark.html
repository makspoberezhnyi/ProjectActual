<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    a{color:var(--accent);}
  </style>
</head>
<body style="margin:0;background:#0a0a0a;display:flex;align-items:flex-start;justify-content:center;padding:40px;">
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#141414; --ink:#f2f0ec; --ink-soft:#a8a49c; --ink-faint:#68645c;
      --accent:#f2f0ec; --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    a{color:var(--accent);}
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;">

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="13" stroke="var(--ink)" stroke-width="1.8"/>
      <line x1="15" y1="10" x2="15" y2="6" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>

  <div style="padding:0 0 90px;display:flex;flex-direction:column;align-items:center;">
    <div style="font-size:15px;color:var(--ink-faint);letter-spacing:0.02em;">Actual</div>
  </div>

</div>
</body>
</html>
